# FindIt — per-client request limits. Install as /etc/nginx/conf.d/findit-limits.conf: files in
# conf.d are included at the http level, which is where limit_req_zone must be. It holds no
# domain, so it can be installed or updated without touching the site file.
# The zones are used by deploy/nginx/findit-proxy.conf (included in the site's server block).
# Names start with "findit_" so they cannot clash with zones of other sites on the server.
#
# The key is the client address ($binary_remote_addr). Behind a CDN or another proxy every
# visitor would share the proxy's address and one limit; in that case use the real client
# address instead (set_real_ip_from + real_ip_header) before relying on these numbers.
# 1 MiB of zone memory holds roughly 16,000 addresses.

# Live camera frames: the page sends at most one frame per 200 ms (Fast mode, ~5 per second)
# and waits for each answer, so 8 per second leaves room for retries after "busy".
limit_req_zone $binary_remote_addr zone=findit_live:1m rate=8r/s;

# Every other /api/ call (upload detection, info, health): occasional, never a stream.
limit_req_zone $binary_remote_addr zone=findit_api:1m rate=3r/s;
