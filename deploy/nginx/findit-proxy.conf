# FindIt — proxy rules for the existing Nginx (include inside the site's server block).
# One upstream serves the page, static files and /api/. Uploaded photos must never be
# written to disk, so request and response buffering to temporary files is off.

client_max_body_size 11m;          # the app itself rejects anything over 10 MiB with 413
client_body_buffer_size 11m;       # keep any held body in memory
client_body_in_file_only off;
proxy_request_buffering off;       # stream request bodies; no temp file
proxy_buffering off;               # stream responses; no proxy_temp file
proxy_max_temp_file_size 0;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# The app sets CSP, nosniff, Referrer-Policy, Permissions-Policy (camera=self) and
# Cache-Control (no-store on /api/, no-cache elsewhere). Not overridden here.

location / {
    proxy_pass http://findit_app;
}
