# FindIt — proxy rules for the existing Nginx (include inside the site's server block).
# One upstream serves the page, static files and /api/. Uploaded photos must never be
# written to disk, so request and response buffering to temporary files is off.

client_max_body_size 11m;          # the app itself rejects anything over 10 MiB with 413
client_body_buffer_size 11m;       # keep any held body in memory
client_body_in_file_only off;
proxy_request_buffering off;       # stream request bodies; no temp file
proxy_buffering off;               # stream responses; no proxy_temp file
proxy_max_temp_file_size 0;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# The app sets CSP, nosniff, Referrer-Policy, Permissions-Policy (camera=self) and
# Cache-Control (no-store on /api/, no-cache elsewhere). Not overridden here.

# Per-client limits (zones: deploy/nginx/findit-limits.conf, installed in conf.d). The app
# also has its own global cap for live frames (FINDIT_LIVE_DUTY); these limits stop one
# address from using all of it. Refused requests get 429; the Live page treats 429 like
# "busy" and slows down. "nodelay" serves a burst at once and refuses the excess instead of
# holding connections open. Rejections are logged at "notice", which the site's error_log
# (level warn) does not write, so a flood neither fills the log nor records addresses.
limit_req_status 429;
limit_req_log_level notice;

location = /api/detect/live {
    limit_req zone=findit_live burst=16 nodelay;
    proxy_pass http://findit_app;
}

location /api/ {
    limit_req zone=findit_api burst=10 nodelay;
    proxy_pass http://findit_app;
}

location / {
    proxy_pass http://findit_app;
}
